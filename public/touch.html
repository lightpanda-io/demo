<!DOCTYPE html>
<html>
<head>
<title>Touch input</title>
<style>
  body { margin: 0; }
  #target { width: 200px; height: 120px; background: #ccc; }
</style>
</head>
<body>
  <div id="target">target</div>
<script>
  // Recorded on document in the capture phase, so an event that lands on a
  // different target than expected is still seen rather than looking like
  // nothing fired at all.
  window.log = [];
  const types = ['touchstart', 'touchmove', 'touchend', 'touchcancel',
                 'pointerover', 'pointerenter', 'pointerdown', 'pointermove',
                 'pointerup', 'pointerout', 'pointerleave',
                 'mouseover', 'mouseenter', 'mousemove', 'mousedown',
                 'mouseup', 'mouseout', 'mouseleave', 'click'];
  for (const type of types) {
    document.addEventListener(type, (e) => {
      const rec = { type: e.type, target: e.target.id || e.target.nodeName };
      if (e.changedTouches) {
        rec.touches = e.touches.length;
        rec.targetTouches = e.targetTouches.length;
        rec.changedTouches = e.changedTouches.length;
        rec.listsAreDistinct = e.touches !== e.targetTouches;
        const touch = e.changedTouches[0];
        if (touch) {
          rec.touch = {
            identifier: touch.identifier,
            pageMatchesClient: touch.pageX === touch.clientX && touch.pageY === touch.clientY,
            radiusX: touch.radiusX,
            radiusY: touch.radiusY,
            rotationAngle: touch.rotationAngle,
            force: touch.force,
            targetIsElement: touch.target === document.getElementById('target'),
          };
        }
      }
      window.log.push(rec);
    }, true);
  }
  window.reset = () => { window.log = []; };
</script>
</body>
</html>
