<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Selector benchmark</title></head>
<body>
<div id="bench"></div>
<div id="attrbench"></div>
<script>
// Selector matching benchmark. Results go to console.warn (console.log/info are
// filtered out of lightpanda's stderr).
//
//   cd ../demo && go run runner/main.go -serve -http-dir benchmark
//   lightpanda fetch http://127.0.0.1:1234/selectors.html 2>&1 |
//     sed -n -e 's/.*param\.0=//p' -e 's/^ *arg(1): \(.*\) (string)$/\1/p'
//
// (the two sed expressions cover the release and debug log formats)
//
// The interesting number is SCALE: how the per-query cost grows as the sibling
// group widens. Each width is 4x the last, so linear matching lands near 4x and
// quadratic matching near 16x.

var WIDTHS = [250, 1000, 4000];
var BUDGET_MS = 100;   // keep running a case until it has burned this much time
var MAX_ITERS = 20000;

// Cycling the tag keeps the of-type ordinals different from the child ordinals,
// and the interleaved whitespace exercises the non-element sibling skipping.
var ROW_TAGS = ['div', 'section', 'p'];

function buildRows(width) {
    var html = [];
    for (var i = 0; i < width; i++) {
        var tag = ROW_TAGS[i % ROW_TAGS.length];
        html.push('<', tag, ' class="row r', i, '">');
        html.push('<span class="cell">a', i, '</span>\n');
        html.push('<span class="cell ', (i === width - 1 ? 'needle' : 'chaff'), '">b', i, '</span>');
        html.push('</', tag, '>\n');
    }
    document.getElementById('bench').innerHTML = html.join('');
}

// Cases are ordered cheapest-first. `max` skips a case above a width where its
// cost would dominate the whole run.
var CASES = [
    { name: 'tag (baseline)',      sel: '#bench > div' },
    { name: 'class (baseline)',    sel: '#bench > .row' },
    { name: ':first-child',        sel: '#bench > .row:first-child' },
    { name: ':last-child',         sel: '#bench > .row:last-child' },
    { name: ':nth-child(2n)',      sel: '#bench > .row:nth-child(2n)' },
    { name: ':nth-last-child(2n)', sel: '#bench > .row:nth-last-child(2n)' },
    { name: ':first-of-type',      sel: '#bench > .row:first-of-type' },
    { name: ':last-of-type',       sel: '#bench > .row:last-of-type' },
    { name: ':only-of-type',       sel: '#bench > .row:only-of-type' },
    { name: ':nth-of-type(2n)',    sel: '#bench > .row:nth-of-type(2n)' },
    { name: ':nth-last-of-type(2n)', sel: '#bench > .row:nth-last-of-type(2n)' },
    // Same pseudo, 2-wide sibling groups: the cost should stay flat, which is
    // what says the problem is group width and not nth-child itself.
    { name: 'narrow :nth-child(2)', sel: '#bench .cell:nth-child(2)' },
    // Same pseudo one segment up: matchDescendant re-tests the ancestor for
    // every descendant, so the ordinal is recomputed once per cell.
    { name: 'ancestor :nth-child(2n)', sel: '#bench > .row:nth-child(2n) .cell' },
    // Comma list: both selectors walk the same root, so the ordinals should be
    // indexed once for the pair, not once per selector.
    { name: 'list of two nth', sel: '#bench > .row:nth-child(2n), #bench > .row:nth-child(3n)' },
    { name: ':has()',              sel: '#bench div:has(.needle)' },
    { name: ':lang(en)',           sel: '#bench .cell:lang(en)' },
    // Backtracking blowup: the middle compound matches nothing, so every
    // candidate rescans the whole sibling group for every preceding sibling.
    { name: 'chained ~ (no match)', sel: '#bench .row ~ .nomatch ~ .row', max: 1000 }
];

// ---------------------------------------------------------------------------
// Attribute phase.
//
// The rows above carry exactly one attribute, so they measure the constant cost
// of an attribute lookup and say nothing about how it scales with the number of
// attributes on an element. These rows draw their attribute count from a
// histogram measured over amazon and github (mean 2.1, with a tail where ~11%
// of elements carry ~35% of all the attributes), so a lookup walks a realistic
// number of entries.
// ---------------------------------------------------------------------------

// count -> weight. amazon + github, summed.
var ATTR_HISTOGRAM = [411, 1841, 607, 415, 296, 124, 68, 89, 106, 38, 11];

// Split deliberately: lightpanda interns the common attribute names, so a
// lookup for one of those can compare pointers, while a `data-*` name has to
// fall back to a byte compare. The cases below probe each path.
var FILLER_NAMES = [
    'href', 'type', 'title', 'role', 'src', 'alt', 'style', 'target', 'value',
    'data-testid', 'data-component', 'aria-live', 'itemprop', 'data-analytics'
];

// xorshift32. Deterministic so the shape is identical across runs and browsers.
function rng(seed) {
    var s = seed;
    return function () {
        s ^= s << 13; s >>>= 0;
        s ^= s >>> 17;
        s ^= s << 5;  s >>>= 0;
        return s / 4294967296;
    };
}

// Returns the realized mean attribute count, so the table is self-documenting.
function buildAttrRows(width) {
    var total = 0;
    for (var i = 0; i < ATTR_HISTOGRAM.length; i++) total += ATTR_HISTOGRAM[i];

    var next = rng(0x9E3779B9);
    var html = [];
    var attr_count = 0;

    for (var i = 0; i < width; i++) {
        var r = next() * total, n = 0;
        while (n < ATTR_HISTOGRAM.length - 1 && (r -= ATTR_HISTOGRAM[n]) > 0) n++;
        attr_count += n;

        // ~1 in 5 attributed elements carries no class at all: that is the case
        // a has-class shortcut would serve, and a full-scan miss for `.row`.
        var has_class = n > 0 && (i % 5) !== 0;
        // class is not always the first attribute, so the scan has to walk past
        // other entries to reach it.
        var class_at = has_class ? Math.floor(next() * n) : -1;

        var attrs = [];
        var filler = 0;
        for (var s = 0; s < n; s++) {
            if (s === class_at) {
                // A third of the class values hold several classes; those are
                // the ones the class-value tokenizer actually costs on.
                attrs.push(' class="row r' + i + (i % 3 === 0 ? ' chip tone-' + (i % 7) : '') + '"');
            } else {
                attrs.push(' ' + FILLER_NAMES[(i + filler) % FILLER_NAMES.length] + '="v' + i + '"');
                filler++;
            }
        }
        html.push('<div', attrs.join(''), '>x', i, '</div>\n');
    }
    document.getElementById('attrbench').innerHTML = html.join('');
    return attr_count / width;
}

// Passes per attribute case; the reported number is the best of these.
var ATTR_REPS = 5;

var ATTR_CASES = [
    // Walks to the class entry, then tokenizes its value.
    { name: 'class hit',           sel: '#attrbench > .row' },
    // Nothing matches: each candidate either scans every entry (no class at
    // all) or finds class and fails on the value.
    { name: 'class miss',          sel: '#attrbench > .nomatch' },
    // Only the multi-class values match, so this leans on the tokenizer.
    { name: 'class multi',         sel: '#attrbench > .chip' },
    // Full scan of every candidate on a name that IS interned.
    { name: 'interned miss',       sel: '#attrbench > [disabled]' },
    // Same scan on a name that is NOT interned: the control that says how much
    // of any win came from the interned-pointer path rather than from the walk.
    { name: 'uninterned miss',     sel: '#attrbench > [data-absent]' },
    // Interned name, present on most candidates.
    { name: 'interned hit',        sel: '#attrbench > [href]' }
];

function run(sel) {
    var iters = 0;
    var matched = 0;
    var start = performance.now();
    var elapsed = 0;
    while (iters < MAX_ITERS) {
        matched = document.querySelectorAll(sel).length;
        iters++;
        elapsed = performance.now() - start;
        if (elapsed >= BUDGET_MS) break;
    }
    return { iters: iters, matched: matched, us: (elapsed * 1000) / iters };
}

function pad(v, n)  { v = '' + v; while (v.length < n) v += ' '; return v; }
function padL(v, n) { v = '' + v; while (v.length < n) v = ' ' + v; return v; }

var previous = {};
console.warn('selector-bench widths=' + WIDTHS.join(','));

for (var w = 0; w < WIDTHS.length; w++) {
    var width = WIDTHS[w];
    buildRows(width);

    console.warn('');
    console.warn('W=' + width);
    console.warn('  ' + pad('case', 24) + padL('match', 7) + padL('iters', 8) + padL('us/query', 12) + padL('scale', 8));

    for (var c = 0; c < CASES.length; c++) {
        var kase = CASES[c];
        if (kase.max && width > kase.max) {
            console.warn('  ' + pad(kase.name, 24) + padL('-', 7) + padL('-', 8) + padL('skipped', 12) + padL('-', 8));
            continue;
        }

        document.querySelectorAll(kase.sel); // warm the parsed-selector cache
        var res = run(kase.sel);

        var scale = '-';
        if (previous[kase.name] > 0) {
            scale = (res.us / previous[kase.name]).toFixed(1) + 'x';
        }
        previous[kase.name] = res.us;

        console.warn('  ' + pad(kase.name, 24) + padL(res.matched, 7) + padL(res.iters, 8) +
                     padL(res.us.toFixed(1), 12) + padL(scale, 8));
    }
}

console.warn('');
console.warn('attribute phase (histogram: amazon + github)');

// Empty the main tree so its rows cannot affect these walks.
document.getElementById('bench').innerHTML = '';

for (var w = 0; w < WIDTHS.length; w++) {
    var width = WIDTHS[w];
    var mean = buildAttrRows(width);

    console.warn('');
    console.warn('W=' + width + ' mean_attrs=' + mean.toFixed(2));
    console.warn('  ' + pad('case', 24) + padL('match', 7) + padL('iters', 8) + padL('us/query', 12) + padL('scale', 8));

    for (var c = 0; c < ATTR_CASES.length; c++) {
        var kase = ATTR_CASES[c];
        document.querySelectorAll(kase.sel); // warm the parsed-selector cache
        // These cases are cheap (tens of us), so a single GC pause inside one
        // budget swings the mean by more than any change worth measuring. Take
        // the best of several passes: the main table above is a plain mean, so
        // do not compare the two tables' absolute numbers to each other.
        var res = null;
        for (var rep = 0; rep < ATTR_REPS; rep++) {
            var r = run(kase.sel);
            if (res === null || r.us < res.us) res = r;
        }

        var scale = '-';
        if (previous[kase.name] > 0) {
            scale = (res.us / previous[kase.name]).toFixed(1) + 'x';
        }
        previous[kase.name] = res.us;

        console.warn('  ' + pad(kase.name, 24) + padL(res.matched, 7) + padL(res.iters, 8) +
                     padL(res.us.toFixed(1), 12) + padL(scale, 8));
    }
}

console.warn('');
console.warn('selector-bench done');
</script>
</body>
</html>
