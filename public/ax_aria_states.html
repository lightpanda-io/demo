<!DOCTYPE html>
<html lang="en">
<head>
  <title>AX ARIA states</title>
</head>
<body>
  <button aria-label="Expanded details" aria-expanded="true">x</button>
  <button aria-label="Collapsed details" aria-expanded="false">x</button>
  <button aria-label="Uppercase expanded" aria-expanded="TRUE">x</button>
  <button aria-label="Invalid expanded" aria-expanded="sometimes">x</button>
  <button aria-label="Spaced expanded" aria-expanded=" true ">x</button>
  <button aria-label="Empty expanded" aria-expanded="">x</button>
  <div aria-label="Generic expanded" aria-expanded="true" tabindex="0">x</div>
  <a role="button" aria-label="Custom anchor" aria-expanded="true" tabindex="0">x</a>
  <ul><li aria-label="Listitem expanded" aria-expanded="true">x</li></ul>

  <div role="checkbox" aria-label="Checkbox mixed" aria-checked="mixed" tabindex="0">x</div>
  <div role="checkbox" aria-label="Uppercase mixed" aria-checked="MIXED" tabindex="0">x</div>
  <div role="checkbox" aria-label="Absent checked" tabindex="0">x</div>
  <div role="checkbox" aria-label="Invalid checked" aria-checked="garbage" tabindex="0">x</div>
  <div role="checkbox" aria-label="Empty checked" aria-checked="" tabindex="0">x</div>
  <div role="checkbox" aria-label="Spaced checked" aria-checked=" true " tabindex="0">x</div>
  <div role="switch" aria-label="Switch mixed" aria-checked="mixed" tabindex="0">x</div>
  <div role="radio" aria-label="Radio absent" tabindex="0">x</div>
  <div role="menuitemcheckbox" aria-label="Menu checkbox mixed" aria-checked="mixed" tabindex="0">x</div>
  <div role="listbox" aria-label="Listbox">
    <div role="option" aria-label="Option checked" aria-checked="true">x</div>
    <div role="option" aria-label="Option mixed" aria-checked="mixed">x</div>
  </div>
  <div role="tree" aria-label="Tree">
    <div role="treeitem" aria-label="Treeitem checked" aria-checked="true" aria-expanded="false">x</div>
  </div>
  <input type="checkbox" aria-label="Native checked" aria-checked="false" checked>

  <button aria-label="Padded collapsed" aria-expanded=" false ">x</button>
  <button aria-label="Blank expanded" aria-expanded="   ">x</button>
  <div role="checkbox" aria-label="Padded false" aria-checked=" false " tabindex="0">x</div>
  <div role="checkbox" aria-label="Blank checked" aria-checked="   " tabindex="0">x</div>
  <div role="listbox" aria-label="Plain listbox">
    <div role="option" aria-label="Option absent">x</div>
    <div role="option" aria-label="Option empty" aria-checked="">x</div>
  </div>
  <div role="tree" aria-label="Plain tree">
    <div role="treeitem" aria-label="Treeitem absent">x</div>
  </div>
  <select aria-label="Native select"><option>Native option</option></select>
</body>
</html>
